name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast-evidence-gates:
    name: Fast catalog, sandbox, and evidence gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run fast evidence gates
        run: >
          uv run --frozen --python 3.11 --extra dev pytest -q
          tests/test_benchmark_catalog.py
          tests/test_execution.py
          tests/test_evidence.py
          tests/test_ablation_evidence.py
          tests/test_paper_gap_report.py

  full-pytest:
    name: Full pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run full test suite
        run: uv run --frozen --python 3.11 --extra dev pytest -q
